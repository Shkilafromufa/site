  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d3f2c"/>
      <stop offset="1" stop-color="#16261a"/>
    </linearGradient>
  </defs>
  <rect width="360" height="240" rx="18" fill="url(#g)" stroke="#00d4aa" stroke-width="3"/>
  <rect x="28" y="32" width="304" height="176" rx="12" fill="none" stroke="#1c5b3f" stroke-width="2" stroke-dasharray="12 10"/>
  <text x="50%" y="84" fill="#00d4aa" font-family="Roboto,Arial,sans-serif" font-size="32" font-weight="600" text-anchor="middle">ISO 14001</text>
  <text x="50%" y="118" fill="#cdebdc" font-family="Roboto,Arial,sans-serif" font-size="16" text-anchor="middle">Экологический менеджмент</text>
